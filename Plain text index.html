<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的课程表</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: "Microsoft YaHei", Arial, sans-serif;
    background: #f5f7fb;
    color: #333;
}

.app {
    max-width: 1200px;
    margin: auto;
    padding: 20px;
}

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
}

h1 {
    margin: 0;
    font-size: 28px;
}
.period small {
    font-size: 10px;
    color:#666;
    display:block;
    margin-top:3px;
    line-height:1.2;
}
button {
    border: none;
    cursor: pointer;
    border-radius: 10px;
    padding: 10px 16px;
    font-size: 15px;
}

.add-btn {
    background: #4f7cff;
    color: white;
}

.table-box {
    overflow-x: auto;
    background: white;
    border-radius: 16px;
    box-shadow: 0 5px 20px rgba(0,0,0,.08);
}

.schedule {
    min-width: 900px;
    display: grid;
    grid-template-columns: 55px repeat(7, 1fr);
}

.cell {
    min-height: 75px;
    border-right: 1px solid #eee;
    border-bottom: 1px dashed #ddd;
    padding: 6px;
}

.day {
    min-height: 55px;
    text-align: center;
    font-weight: bold;
    background: #fafafa;
    padding-top: 18px;
}

.period {
    text-align: center;
    color: #888;
    background: #fafafa;
    padding-top: 28px;
}
.period small {
    font-size: 10px;
    color:#666;
    display:block;
    margin-top:3px;
    line-height:1.2;
}

.course {
    height: 100%;
    min-height: 60px;
    background: #e8f1ff;
    border-radius: 10px;
    padding: 8px;
    cursor: pointer;
    font-size: 13px;
}

.course strong {
    display: block;
    margin-bottom: 5px;
}

.course:hover {
    box-shadow: 0 3px 10px rgba(0,0,0,.15);
}

.modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.4);
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.modal.show {
    display: flex;
}

.form {
    width: 100%;
    max-width: 400px;
    background: white;
    border-radius: 18px;
    padding: 25px;
}

.form h2 {
    margin-top: 0;
}

.form label {
    display: block;
    margin-top: 12px;
    margin-bottom: 5px;
}

.form input,
.form select {
    width: 100%;
    padding: 10px;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-size: 15px;
}

.actions {
    display: flex;
    gap: 10px;
    margin-top: 20px;
}

.save {
    background: #4f7cff;
    color: white;
    flex: 1;
}

.cancel {
    background: #eee;
    flex: 1;
}

.delete {
    background: #ff6666;
    color: white;
    flex: 1;
}
</style>
</head>

<body>

<div class="app">

    <div class="header">
        <h1>📚 我的课程表</h1>
        <button class="add-btn" onclick="openModal()">＋ 添加课程</button>
    </div>

    <div class="table-box">
   <div class="week-selector">
  <label>当前周：</label>
  <button id="prevWeek">←上一周</button>
  <select id="weekSelect">
    <option value="1">第1周</option>
    <option value="2">第2周</option>
    <option value="3">第3周</option>
    <option value="4">第4周</option>
    <option value="5">第5周</option>
    <option value="6">第6周</option>
    <option value="7">第7周</option>
    <option value="8">第8周</option>
    <option value="9">第9周</option>
    <option value="10">第10周</option>
    <option value="11">第11周</option>
    <option value="12">第12周</option>
    <option value="13">第13周</option>
    <option value="14">第14周</option>
    <option value="15">第15周</option>
    <option value="16">第16周</option>
  </select>
  <button id="nextWeek">下一周→</button>
</div>
        <div class="schedule" id="schedule"></div>
    </div>

</div>

<!-- 添加课程窗口 -->
<div class="modal" id="modal">

    <div class="form">

        <h2>添加课程</h2>

        <label>课程名称</label>
        <input id="courseName" placeholder="例如：会计学原理">

        <label>星期</label>
        <select id="day">
            <option value="1">周一</option>
            <option value="2">周二</option>
            <option value="3">周三</option>
            <option value="4">周四</option>
            <option value="5">周五</option>
            <option value="6">周六</option>
            <option value="7">周日</option>
        </select>

        <label>开始节次</label>
        <select id="start">
            <option>1</option>
            <option>2</option>
            <option>3</option>
            <option>4</option>
            <option>5</option>
            <option>6</option>
            <option>7</option>
            <option>8</option>
            <option>9</option>
            <option>10</option>
            <option>11</option>
            <option>12</option>
        </select>

        <label>结束节次</label>
        <select id="end">
            <option>1</option>
            <option>2</option>
            <option>3</option>
            <option>4</option>
            <option>5</option>
            <option>6</option>
            <option>7</option>
            <option>8</option>
            <option>9</option>
            <option>10</option>
            <option>11</option>
            <option>12</option>
        </select>
        <label>上课周数</label>
<select id="courseWeek">
    <option value="1">第1周</option>
    <option value="2">第2周</option>
    <option value="3">第3周</option>
    <option value="4">第4周</option>
    <option value="5">第5周</option>
    <option value="6">第6周</option>
    <option value="7">第7周</option>
    <option value="8">第8周</option>
    <option value="9">第9周</option>
    <option value="10">第10周</option>
    <option value="11">第11周</option>
    <option value="12">第12周</option>
    <option value="13">第13周</option>
    <option value="14">第14周</option>
    <option value="15">第15周</option>
    <option value="16">第16周</option>
</select>

        <label>上课地点</label>
        <input id="room" placeholder="例如：教学楼 A302">

        <div class="actions">
            <button class="cancel" onclick="closeModal()">取消</button>
            <button class="save" onclick="saveCourse()">保存课程</button>
        </div>

    </div>
</div>

<script>

let courses = JSON.parse(localStorage.getItem("courses") || "[]");

const days = [
    "",
    "周一",
    "周二",
    "周三",
    "周四",
    "周五",
    "周六",
    "周日"
];
const periodTime = [
    "8:30‑9:10",
    "9:10‑9:50",
    "10:10‑10:50",
    "10:50‑11:30",
    "11:35‑12:15",
    "12:30‑13:10",
    "13:10‑13:50",
    "14:00‑14:40",
    "14:40‑15:20",
    "15:40‑16:20",
    "16:20‑17:00",
    "18:30‑19:10",
    "19:10‑19:50",
    "20:00‑20:40",
    "20:40‑21:20"
];


let currentWeek = 1;

document.getElementById('weekSelect').addEventListener('change', function () {
    currentWeek = Number(this.value);
    render();
});
//课程背景配色
const colorList = [
    "#409EFF",
    "#67C23A",
    "#E6A23C",
    "#F56C6C",
    "#909399",
    "#00B4FF",
    "#722ED1",
    "#13C2C2"
];
//上一周、下一周按钮
document.getElementById('prevWeek').addEventListener('click', function () {
    if (currentWeek > 1) {
        currentWeek--;
        document.getElementById('weekSelect').value = currentWeek;
        render();
    }
});

document.getElementById('nextWeek').addEventListener('click', function () {
    if (currentWeek < 18) {
        currentWeek++;
        document.getElementById('weekSelect').value = currentWeek;
        render();
    }
});


function render() {

    const schedule = document.getElementById("schedule");

    schedule.innerHTML = "";

    // 表头
    schedule.innerHTML += `<div class="cell day">节次</div>`;

    for (let d = 1; d <= 7; d++) {
        schedule.innerHTML += `<div class="cell day">${days[d]}</div>`;
    }

    // 每一节课
    for (let period = 1; period <= 15; period++) {

       schedule.innerHTML += `
        <div class="cell period">第${period}节<br><small>${periodTime[period-1]}</small></div>`

        for (let day = 1; day <= 7; day++) {

            const course = courses.find(c =>
                Number(c.day) === day &&
                period >= Number(c.start) &&
                period <= Number(c.end) && c.week === currentWeek
              );

            if (course && period === Number(course.start)) {

                const height = (Number(course.end) - Number(course.start) + 1) * 75;

                schedule.innerHTML += `
                    <div class="cell" style="grid-row: span ${Number(course.end) - Number(course.start) + 1};">
                        <div class="course"
                             style="min-height:${height - 12}px;
                             background-color:${colorList[course.id % colorList.length]}"
                             onclick="removeCourse(${course.id})">
                            <strong>${course.name}</strong>
                            ${course.room || "地点未填写"}
                            <br>
                            第 ${course.start}-${course.end} 节
                            <br><br>
                            <small>点击删除</small>
                        </div>
                    </div>
                `;

            } else if (!course) {

                schedule.innerHTML += `
                    <div class="cell"></div>
                `;

            }
        }
    }
}

function openModal() {
    document.getElementById("modal").classList.add("show");
}

function closeModal() {
    document.getElementById("modal").classList.remove("show");
}

function saveCourse() {

    const name = document.getElementById("courseName").value.trim();
    const day = document.getElementById("day").value;
    const start = document.getElementById("start").value;
    const end = document.getElementById("end").value;
    const room = document.getElementById("room").value.trim();

    if (!name) {
        alert("请输入课程名称！");
        return;
    }

    if (Number(start) > Number(end)) {
        alert("结束节次不能早于开始节次！");
        return;
    }

    const course = {
        id: Date.now(),
        name,
        day,
        start,
        end,
        room,
        week:
         Number(document.getElementById('courseWeek').value)
    };

    courses.push(course);

    localStorage.setItem("courses", JSON.stringify(courses));

    render();

    closeModal();

    document.getElementById("courseName").value = "";
    document.getElementById("room").value = "";
}

function removeCourse(id) {

    const ok = confirm("确定要删除这门课程吗？");

    if (!ok) return;

    courses = courses.filter(c => c.id !== id);

    localStorage.setItem("courses", JSON.stringify(courses));

    render();
}

render();

</script>

</body>
</html>
